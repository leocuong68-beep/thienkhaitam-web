<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tải Thiền Khai Tâm</title>
<meta property="og:title" content="Tải ứng dụng Thiền Khai Tâm">
<meta property="og:description" content="Dẫn thiền tiếng Việt, tập thở, gõ mõ, chuông xoay và chương trình Khai Tâm 90 ngày.">
<meta property="og:image" content="https://thienkhaitam.com/icon-512.png">
<link rel="icon" href="/favicon.png">
<script>
(function () {
  var IOS = 'https://apps.apple.com/app/id6819858650';
  var ANDROID = ''; // điền link Google Play khi có
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
  var isAndroid = /Android/i.test(ua);
  if (isIOS) { location.replace(IOS); return; }
  if (isAndroid && ANDROID) { location.replace(ANDROID); return; }
  window.__android = isAndroid;
})();
</script>
<style>
:root{--bg:#0A1124;--card:#141E3A;--line:#26335A;--text:#F4EDDF;--muted:#A7B0C6;--gold:#D2A65A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px}
.box{max-width:420px;width:100%;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 24px}
img.icon{width:88px;height:88px;border-radius:20px}
h1{font-family:Georgia,serif;font-size:26px;margin:14px 0 6px}
p{color:var(--muted);margin:0 0 20px}
a.btn{display:block;padding:14px;border-radius:14px;background:var(--gold);color:#0A1124;font-weight:600;text-decoration:none;margin-top:10px}
a.alt{display:block;color:var(--muted);margin-top:16px;font-size:15px}
#qr{margin:8px auto 0;width:180px;height:180px;background:#fff;border-radius:12px;padding:10px}
#qr img{width:100%;height:100%}
.hide{display:none}
</style>
</head>
<body>
<div class="box">
  <img class="icon" src="/apple-touch-icon.png" alt="">
  <h1>Thiền Khai Tâm</h1>
  <div id="android" class="hide">
    <p>Bản Android đang được hoàn thiện và sẽ có trên Google Play trong thời gian tới.</p>
    <a class="btn" href="/">Xem giới thiệu ứng dụng</a>
  </div>
  <div id="desktop">
    <p>Quét mã bằng camera điện thoại để tải ứng dụng.</p>
    <div id="qr"><img alt="Mã QR tải ứng dụng" src="/qr-tai.png"></div>
    <a class="btn" href="https://apps.apple.com/app/id6819858650">Mở trên App Store</a>
  </div>
  <a class="alt" href="/">Về trang giới thiệu</a>
</div>
<script>
if (window.__android) { document.getElementById('android').classList.remove('hide'); document.getElementById('desktop').classList.add('hide'); }
</script>
</body>
</html>
